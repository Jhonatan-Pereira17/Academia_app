services:
  postgres:
    image: postgres:16
    container_name: academia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: academia_db
      POSTGRES_USER: academia_user
      POSTGRES_PASSWORD: academia_pass_dev
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
